openapi: 3.0.0
info:
  title: Homie Backend API
  version: 1.0.0
  description: API description

servers:
  - url: http://localhost:3001
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth:
    post:
      summary: Authenticate a user with a Google ID token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserDtoRequest'
      responses:
        '201':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserDtoResponse'
        '401':
          description: Authentication failed

  /users/{id}:
    get:
      summary: Get user by id
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

  /user-settings/{id}:
    patch:
      summary: Update user settings
      tags:
        - User Settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserSettingsResponse'
        '401':
          description: Unauthorized

  /properties:
    post:
      summary: Create a new property
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /properties/{propertyId}:
    put:
      summary: Update a property
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Property not found

  /properties/{propertyId}/images:
    post:
      summary: Upload a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: boolean
              required:
                - file
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImageResponse'
        '400':
          description: Invalid file
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Property not found

  /properties/{propertyId}/images/{imageId}:
    get:
      summary: Get a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
    delete:
      summary: Delete a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Image not found
    patch:
      summary: Update a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyImageRequest'
      responses:
        '200':
          description: Image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Image not found

  /equipment/{propertyId}/{equipmentType}:
    patch:
      summary: Update property equipment quantity
      tags:
        - Equipment
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: equipmentType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
      responses:
        '200':
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '404':
          description: Equipment not found for property

  /equipment-types:
    get:
      summary: Get all equipment types
      tags:
        - Equipment Types
      responses:
        '200':
          description: List of equipment types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentTypeResponse'
    post:
      summary: Create equipment type
      tags:
        - Equipment Types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentTypeRequest'
      responses:
        '201':
          description: Equipment type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentTypeResponse'
        '401':
          description: Unauthorized

  /roommate-requests:
    post:
      summary: Create roommate request
      tags:
        - Roommate Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoommateRequestRequest'
      responses:
        '201':
          description: Roommate request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestResponse'
        '401':
          description: Unauthorized
    get:
      summary: Get paginated roommate requests
      tags:
        - Roommate Requests
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: lat
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Paginated list of roommate requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestListResponse'

  /roommate-requests/{roommateRequestId}:
    get:
      summary: Get roommate request detail by id
      description: Returns a single roommate request together with its owner's contact details and the full property.
      tags:
        - Roommate Requests
      parameters:
        - name: roommateRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Roommate request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestDetailResponse'
        '404':
          description: Roommate request not found
    put:
      summary: Update roommate request
      tags:
        - Roommate Requests
      parameters:
        - name: roommateRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoommateRequestRequest'
      responses:
        '200':
          description: Roommate request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Roommate request not found

  /users/{userId}/roommate-requests:
    get:
      summary: Get the user's own roommate requests
      tags:
        - Roommate Requests
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of the user's own roommate requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoommateRequestsPage'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{userId}/roommate-requests/{roommateRequestId}:
    get:
      summary: Get the user's own roommate request detail with applications
      description: Returns the roommate request (with owner and property) together with all of its roommate applications and each applicant's contact details. Only the request owner can view it.
      tags:
        - Roommate Requests
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: roommateRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Roommate request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoommateRequestDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Roommate request not found

  /roommate-applications:
    post:
      summary: Apply for a roommate request
      tags:
        - Roommate Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoommateApplicationRequest'
      responses:
        '201':
          description: Roommate application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationResponse'
        '401':
          description: Unauthorized
        '404':
          description: Roommate request not found

    get:
      summary: Get the owner's roommate applications
      tags:
        - Roommate Applications
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoommateApplicationStatus'
      responses:
        '200':
          description: Paginated list of the owner's roommate applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationListResponse'
        '401':
          description: Unauthorized

  /roommate-applications/{roommateRequestId}:
    get:
      summary: Get all roommate applications for a roommate request
      description: Returns all roommate applications for a roommate request together with each applicant's contact details. Only the owner of the roommate request can view it.
      tags:
        - Roommate Applications
      parameters:
        - name: roommateRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of roommate applications with applicant info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoommateApplicationWithApplicant'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Roommate request not found

  /roommate-applications/{roommateApplicationId}:
    put:
      summary: Update a roommate application status
      description: Updates the status of a roommate application. Only the owner of the roommate request can update it. Sends a push notification to the applicant.
      tags:
        - Roommate Applications
      parameters:
        - name: roommateApplicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoommateApplicationRequest'
      responses:
        '200':
          description: Roommate application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Roommate application or roommate request not found

  /device-tokens:
    post:
      summary: Register a device token for push notifications
      tags:
        - Device Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceTokenRequest'
      responses:
        '201':
          description: Device token registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Google ID token

  schemas:
    # Enums
    InterestEnum:
      type: string
      enum:
        - FIND_HOUSING
        - RENT

    RoomTypeEnum:
      type: string
      enum:
        - DORMITORY
        - BATHROOM
        - KITCHEN
        - LIVING_ROOM
        - TOILET
        - WARDROBE
        - BALCONY
        - OTHER

    CurrencyEnum:
      type: string
      enum:
        - EUR
        - CZK
        - USD

    RoommateRequestStatus:
      type: string
      enum:
        - ACTIVE
        - RESERVED
        - CLOSED
        - EXPIRED

    RoommateApplicationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED

    # Shared
    IdealLocation:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng

    # Auth / User Schemas
    AuthUserDtoRequest:
      type: object
      properties:
        idToken:
          type: string
      required:
        - idToken

    UserSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'
      required:
        - id
        - userId

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        image:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userSettings:
          $ref: '#/components/schemas/UserSettings'
      required:
        - id
        - email
        - fullName
        - createdAt
        - updatedAt
        - userSettings

    AuthUserDtoResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - user

    # User Settings Schemas
    UpdateUserSettingsRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'

    UpdateUserSettingsResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'
      required:
        - userId

    # Property Schemas
    RoomDto:
      type: object
      properties:
        roomType:
          $ref: '#/components/schemas/RoomTypeEnum'
        count:
          type: integer
          minimum: 1
      required:
        - roomType
        - count

    EquipmentDto:
      type: object
      properties:
        equipmentType:
          type: string
        count:
          type: integer
          minimum: 1
      required:
        - equipmentType
        - count

    CreatePropertyRequest:
      type: object
      properties:
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        sizeM2:
          type: number
        roomCount:
          type: integer
          minimum: 1
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
      required:
        - ownerId
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - rooms
        - equipment

    UpdatePropertyRequest:
      type: object
      properties:
        description:
          type: string
        sizeM2:
          type: number
        roomCount:
          type: integer
          minimum: 1
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
      required:
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - rooms
        - equipment

    PropertyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        sizeM2:
          type: number
        roomCount:
          type: integer
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
      required:
        - id
        - ownerId
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - createdAt
        - updatedAt
        - rooms
        - equipment

    PropertyDetailResponse:
      description: Full property details including photos, rooms and equipment.
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        sizeM2:
          type: number
          nullable: true
        roomCount:
          type: integer
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
        images:
          type: array
          items:
            $ref: '#/components/schemas/PropertyImageResponse'
      required:
        - id
        - ownerId
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - createdAt
        - updatedAt
        - rooms
        - equipment

    PropertyImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        imageUrl:
          type: string
        title:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - propertyId
        - imageUrl
        - title
        - createdAt
        - updatedAt

    UpdatePropertyImageRequest:
      type: object
      properties:
        title:
          type: boolean
      required:
        - title

    # Equipment Schemas
    UpdateEquipmentRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
      required:
        - count

    EquipmentResponse:
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
        equipmentType:
          type: string
        count:
          type: integer
      required:
        - propertyId
        - equipmentType
        - count

    EquipmentTypeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    CreateEquipmentTypeRequest:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    # Roommate Request Schemas
    CreateRoommateRequestRequest:
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
          minimum: 1
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        idealMoveInDate:
          type: string
          format: date
        maxRoommates:
          type: integer
          minimum: 1
        currentRoommates:
          type: integer
          minimum: 0
      required:
        - propertyId
        - title
        - description
        - priceAmount
        - priceCurrency
        - maxRoommates
        - currentRoommates

    UpdateRoommateRequestRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
          minimum: 1
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        idealMoveInDate:
          type: string
          format: date
        maxRoommates:
          type: integer
          minimum: 1
        currentRoommates:
          type: integer
          minimum: 0
      required:
        - title
        - description
        - priceAmount
        - priceCurrency
        - maxRoommates
        - currentRoommates

    RoommateRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        idealMoveInDate:
          type: string
          format: date
          nullable: true
        maxRoommates:
          type: integer
        currentRoommates:
          type: integer
        status:
          $ref: '#/components/schemas/RoommateRequestStatus'
        createdAt:
          type: string
          format: date-time
