openapi: 3.0.0
info:
  title: Homie Backend API
  version: 1.0.0
  description: API description

servers:
  - url: http://localhost:3001
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth:
    post:
      summary: Authenticate a user with a Google ID token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserDtoRequest'
      responses:
        '201':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserDtoResponse'
        '401':
          description: Authentication failed

  /users/{id}:
    get:
      summary: Get user by id
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

  /user-settings/{id}:
    patch:
      summary: Update user settings
      tags:
        - User Settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserSettingsResponse'
        '401':
          description: Unauthorized

  /properties:
    post:
      summary: Create a new property
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /properties/{propertyId}:
    put:
      summary: Update a property
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Property not found

  /properties/{propertyId}/images:
    post:
      summary: Upload a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: boolean
              required:
                - file
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImageResponse'
        '400':
          description: Invalid file
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Property not found

  /properties/{propertyId}/images/url:
    post:
      summary: Upload a property image from a URL
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPropertyImageUrlRequest'
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImageResponse'
        '400':
          description: Invalid URL or downloaded content is not an image
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Property not found

  /properties/{propertyId}/images/{imageId}:
    get:
      summary: Get a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
    delete:
      summary: Delete a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Image not found
    patch:
      summary: Update a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyImageRequest'
      responses:
        '200':
          description: Image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Image not found

  /equipment/{propertyId}/{equipmentType}:
    patch:
      summary: Update property equipment quantity
      tags:
        - Equipment
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: equipmentType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
      responses:
        '200':
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '404':
          description: Equipment not found for property

  /equipment-types:
    get:
      summary: Get all equipment types
      tags:
        - Equipment Types
      responses:
        '200':
          description: List of equipment types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentTypeResponse'
    post:
      summary: Create equipment type
      tags:
        - Equipment Types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentTypeRequest'
      responses:
        '201':
          description: Equipment type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentTypeResponse'
        '401':
          description: Unauthorized

  /listings:
    post:
      summary: Create listing
      tags:
        - Listings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '401':
          description: Unauthorized
    get:
      summary: Get paginated listings
      tags:
        - Listings
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: lat
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: priceFrom
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: priceTo
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: equipment
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: rooms
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [DORMITORY, BATHROOM, KITCHEN, LIVING_ROOM, TOILET, WARDROBE, BALCONY, OTHER]
        - name: sortBy
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [PRICE, DISTANCE_TRANSIT, DISTANCE_CITY_CENTER]
        - name: preferredGender
          in: query
          required: false
          schema:
            type: string
            enum: [MALE, FEMALE, ALL]
            default: ALL
      responses:
        '200':
          description: Paginated list of listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingListResponse'

  /listings/{listingId}:
    get:
      summary: Get listing detail by id
      description: Returns a single listing together with its owner's contact details and the full property.
      tags:
        - Listings
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listing found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetailResponse'
        '404':
          description: Listing not found
    put:
      summary: Update listing
      tags:
        - Listings
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Listing not found

  /listings/{listingId}/status:
    put:
      summary: Update listing status
      tags:
        - Listings
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingStatusRequest'
      responses:
        '200':
          description: Listing status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Invalid status transition
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Listing not found

  /users/{userId}/listings:
    get:
      summary: Get the user's own listings
      tags:
        - Listings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ListingStatus'
      responses:
        '200':
          description: Paginated list of the user's own listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListingsPage'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{userId}/listings/{listingId}:
    get:
      summary: Get the user's own listing detail with applications
      description: Returns the listing (with owner and property) together with all of its roommate applications and each applicant's contact details. Only the listing owner can view it.
      tags:
        - Listings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listing found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListingDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Listing not found

  /users/{userId}/listing-applications:
    get:
      summary: Get all applications for the user's own listings
      description: Returns the paginated list of roommate applications for every listing the user owns, optionally filtered by status, together with each applicant's contact details.
      tags:
        - Listings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoommateApplicationStatus'
      responses:
        '200':
          description: Paginated list of applications for the user's own listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationsWithApplicantPage'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{userId}/listing-applications/count:
    get:
      summary: Get the count of applications for the user's own listings
      description: Returns the total number of roommate applications across every listing the user owns, optionally filtered by status.
      tags:
        - Listings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoommateApplicationStatus'
      responses:
        '200':
          description: Count of applications for the user's own listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationsCount'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /favourites:
    get:
      summary: Get the authenticated user's favourite listings
      tags:
        - Favourites
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of favourite listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingListResponse'
        '401':
          description: Unauthorized
    post:
      summary: Add a listing to favourites
      tags:
        - Favourites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFavouriteRequest'
      responses:
        '201':
          description: Favourite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavouriteResponse'
        '401':
          description: Unauthorized
        '404':
          description: Listing not found

  /favourites/{listingId}:
    delete:
      summary: Remove a listing from favourites
      tags:
        - Favourites
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Favourite removed
        '401':
          description: Unauthorized

  /roommate-applications:
    post:
      summary: Apply for a listing
      tags:
        - Roommate Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoommateApplicationRequest'
      responses:
        '201':
          description: Roommate application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationResponse'
        '400':
          description: Listing is closed
        '401':
          description: Unauthorized
        '404':
          description: Listing not found

    get:
      summary: Get the user's own roommate applications
      description: Returns the paginated list of roommate applications the caller has submitted, optionally filtered by status.
      tags:
        - Roommate Applications
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoommateApplicationStatus'
      responses:
        '200':
          description: Paginated list of the user's roommate applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationListResponse'
        '401':
          description: Unauthorized

  /roommate-applications/{listingId}:
    get:
      summary: Get all roommate applications for a listing
      description: Returns all roommate applications for a listing together with each applicant's contact details. Only the owner of the listing can view it.
      tags:
        - Roommate Applications
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of roommate applications with applicant info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoommateApplicationWithApplicant'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Listing not found

  /roommate-applications/{roommateApplicationId}:
    put:
      summary: Update a roommate application status
      description: Updates the status of a roommate application. Only the owner of the listing can update it. Sends a push notification to the applicant.
      tags:
        - Roommate Applications
      parameters:
        - name: roommateApplicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoommateApplicationRequest'
      responses:
        '200':
          description: Roommate application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateApplicationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Roommate application or listing not found

  /device-tokens:
    post:
      summary: Register a device token for push notifications
      tags:
        - Device Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceTokenRequest'
      responses:
        '201':
          description: Device token registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Google ID token

  schemas:
    # Enums
    InterestEnum:
      type: string
      enum:
        - FIND_HOUSING
        - RENT

    RoomTypeEnum:
      type: string
      enum:
        - DORMITORY
        - BATHROOM
        - KITCHEN
        - LIVING_ROOM
        - TOILET
        - WARDROBE
        - BALCONY
        - OTHER

    CurrencyEnum:
      type: string
      enum:
        - EUR
        - CZK
        - USD

    ListingStatus:
      type: string
      enum:
        - ACTIVE
        - RESERVED
        - CLOSED
        - EXPIRED

    PreferredGender:
      type: string
      enum:
        - MALE
        - FEMALE
        - ALL

    RoommateApplicationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED

    # Shared
    IdealLocation:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng

    # Auth / User Schemas
    AuthUserDtoRequest:
      type: object
      properties:
        idToken:
          type: string
      required:
        - idToken

    UserSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'
      required:
        - id
        - userId

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        image:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userSettings:
          $ref: '#/components/schemas/UserSettings'
      required:
        - id
        - email
        - fullName
        - createdAt
        - updatedAt
        - userSettings

    AuthUserDtoResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - user

    # User Settings Schemas
    UpdateUserSettingsRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'

    UpdateUserSettingsResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'
      required:
        - userId

    # Property Schemas
    RoomDto:
      type: object
      properties:
        roomType:
          $ref: '#/components/schemas/RoomTypeEnum'
        count:
          type: integer
          minimum: 1
      required:
        - roomType
        - count

    EquipmentDto:
      type: object
      properties:
        equipmentType:
          type: string
        count:
          type: integer
          minimum: 1
      required:
        - equipmentType
        - count

    CreatePropertyRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePropertyRequest'
        - type: object
          properties:
            ownerId:
              type: string
              format: uuid
          required:
            - ownerId

    UpdatePropertyRequest:
      type: object
      properties:
        description:
          type: string
        sizeM2:
          type: number
        roomCount:
          type: integer
          minimum: 1
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
      required:
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - rooms
        - equipment

    PropertyBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        roomCount:
          type: integer
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rooms:
          type: array
