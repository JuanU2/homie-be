openapi: 3.0.0
info:
  title: Homie Worker API
  version: 1.0.0
  description: AI (Google Gemini) property analysis API for the Homie app.

servers:
  - url: http://localhost:3002
    description: Development server

paths:
  /ai/health:
    get:
      summary: AI service health check
      tags:
        - AI
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ai/property-analysis:
    post:
      summary: Analyze property photos with Gemini and return structured output
      security:
        - bearerAuth: []
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzePropertyImagesRequest'
      responses:
        '201':
          description: Structured property data extracted from the images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzePropertyImagesResponse'
        '400':
          description: Invalid request body
        '429':
          description: Daily limit of 5 analyses per user reached

  /ai/properties/{propertyId}/insights:
    get:
      summary: Get AI-generated neighborhood insights for a property
      operationId: getPropertyInsights
      security:
        - bearerAuth: []
      tags:
        - AI
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyInsightsResponse'
        '404':
          description: No insights available for this property

  /ai/listing-scraping:
    post:
      summary: Scrape a listing URL and return structured listing data
      operationId: listingScraping
      security:
        - bearerAuth: []
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeListingRequest'
      responses:
        '201':
          description: Structured listing data extracted from the URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeListingResponse'
        '400':
          description: Invalid request body or URL could not be scraped
        '429':
          description: Daily limit of 5 scrapes per user reached

  /ai/messages:
    post:
      summary: Send a chat message about a roommate request and get the AI reply
      operationId: sendChatMessage
      security:
        - bearerAuth: []
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: The user's message and the AI's reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: Conversation does not match the roommate request
        '403':
          description: Conversation does not belong to the authenticated user
        '404':
          description: Roommate request or conversation not found
        '409':
          description: Conversation is not active

  /conversations/{roommateRequestId}:
    get:
      summary: Get the active conversation for a roommate request
      operationId: getActiveConversation
      security:
        - bearerAuth: []
      tags:
        - Conversations
      parameters:
        - name: roommateRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active conversation with messages ordered by creation time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationResponse'
        '404':
          description: No active conversation for this roommate request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Google ID token

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status

    AnalyzePropertyImagesRequest:
      type: object
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            description: Exactly one of `data` or `imageUrl` must be provided. When `imageUrl` is used, the worker downloads the image and processes it.
            properties:
              data:
                type: string
                description: Base64-encoded image bytes.
              imageUrl:
                type: string
                format: uri
                description: URL of the image to download and analyze. Mutually exclusive with `data`.
              mimeType:
                type: string
                description: Image MIME type, e.g. image/jpeg. Optional for `imageUrl` (inferred from the response); defaults to image/jpeg for `data`.
        language:
          type: string
          description: Optional language for the generated description (e.g. "English", "Spanish"). Does not affect the roomType/equipmentType enum values.
        location:
          $ref: '#/components/schemas/PropertyLocation'
      required:
        - images

    PropertyLocation:
      type: object
      description: Optional property address and coordinates, used to contextualize the generated description.
      properties:
        country:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        zipCode:
          type: string
          maxLength: 20
        street:
          type: string
          maxLength: 100
        streetNumber:
          type: string
          maxLength: 10
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      required:
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng

    AnalyzePropertyImagesResponse:
      type: object
      properties:
        description:
          type: string
        sizeM2:
          type: number
          nullable: true
        roomCount:
          type: integer
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/PropertyRoom'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/PropertyEquipment'
      required:
        - description
        - sizeM2
        - roomCount
        - rooms
        - equipment

    PropertyRoom:
      type: object
      properties:
        roomType:
          type: string
          enum:
            - DORMITORY
            - BATHROOM
            - KITCHEN
            - LIVING_ROOM
            - TOILET
            - WARDROBE
            - BALCONY
            - OTHER
        count:
          type: integer
      required:
        - roomType
        - count

    PropertyEquipment:
      type: object
      properties:
        equipmentType:
          type: string
          description: One of the equipment type names defined in the equipment_types table (e.g. fridge, oven, tv).
        count:
          type: integer
      required:
        - equipmentType
        - count

    PropertyInsightsResponse:
      type: object
      properties:
        nearbyPlaces:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/NearbyPlace'
        advantages:
          type: array
          maxItems: 5
          items:
            type: string
      required:
        - nearbyPlaces
        - advantages

    NearbyPlace:
      type: object
      properties:
        placeCategory:
          $ref: '#/components/schemas/PlaceCategory'
        location:
          $ref: '#/components/schemas/InsightLocation'
        name:
          type: string
        distance:
          $ref: '#/components/schemas/InsightDistance'
      required:
        - placeCategory
        - location
        - name
        - distance

    InsightLocation:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng

    InsightDistance:
      type: object
      properties:
        distanceApproxMeters:
          type: integer
        distanceApproxTime:
          $ref: '#/components/schemas/InsightDistanceTime'
      required:
        - distanceApproxMeters
        - distanceApproxTime

    InsightDistanceTime:
      type: object
      properties:
        transportType:
          $ref: '#/components/schemas/TransportType'
        timeInMinutes:
          type: integer
      required:
        - transportType
        - timeInMinutes

    PlaceCategory:
      type: string
      enum:
        - PUBLIC_TRANSPORT
        - SUPERMARKET
        - CITY_CENTER
        - LIBRARY
        - SHOPPING_CENTER
        - SCHOOL
        - HOSPITAL
        - PARKING
        - OTHER

    TransportType:
      type: string
      enum:
        - CAR
        - WALK
        - PUBLIC_TRANSPORT
        - BIKE

    ScrapeListingRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
        - url

    ScrapeListingResponse:
      type: object
      description: All fields are optional; only fields clearly present on the listing page are returned.
      properties:
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: number
        priceCurrency:
          type: string
        idealMoveInDate:
          type: string
          format: date
        maxRoommates:
          type: integer
        currentRoommates:
          type: integer
        property:
          $ref: '#/components/schemas/ScrapeListingProperty'

    ScrapeListingProperty:
      type: object
      properties:
        description:
          type: string
        sizeM2:
          type: integer
        roomCount:
          type: integer
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/PropertyRoom'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/PropertyEquipment'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ScrapeListingImage'

    ScrapeListingImage:
      type: object
      properties:
        imageUrl:
          type: string
        title:
          type: boolean
      required:
        - imageUrl
        - title

    SendMessageRequest:
      type: object
      properties:
        roommateRequestId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
          description: Omit for the first message; the backend creates a new conversation and closes any previous active one for this user and request.
        content:
          type: string
          minLength: 1
      required:
        - roommateRequestId
        - content

    SendMessageResponse:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        clientMessage:
          $ref: '#/components/schemas/ChatMessageResponse'
        response:
          $ref: '#/components/schemas/ChatMessageResponse'
      required:
        - conversationId
        - clientMessage
        - response

    ChatMessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - createdAt

    GetConversationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
      required:
        - id
        - messages

    ConversationMessage:
      type: object
      properties:
        content:
          type: string
        role:
          type: string
          enum:
            - USER
            - AGENT
        createdAt:
          type: string
          format: date-time
      required:
        - content
        - role
        - createdAt
