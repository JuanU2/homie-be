version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: homie-postgres
    restart: always
    environment:
      POSTGRES_USER: homie
      POSTGRES_PASSWORD: homie
      POSTGRES_DB: homie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: homie-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: homie
      RABBITMQ_DEFAULT_PASS: homie
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
