openapi: 3.0.0
info:
  title: Homie Backend API
  version: 1.0.0
  description: API description

servers:
  - url: http://localhost:3001
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth:
    post:
      summary: Authenticate a user and return a JWT token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserDtoRequest'
      responses:
        '201':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserDtoResponse'
        '401':
          description: Authentication failed

  /users/{id}:
    get:
      summary: Get user by id
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

  /user-settings/{id}:
    patch:
      summary: Update user settings
      tags:
        - User Settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserSettingsResponse'
        '401':
          description: Unauthorized

  /properties:
    post:
      summary: Create a new property
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /properties/{propertyId}/images:
    post:
      summary: Upload a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: boolean
              required:
                - file
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImageResponse'
        '400':
          description: Invalid file
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Property not found

  /properties/{propertyId}/images/{imageId}:
    get:
      summary: Get a property image
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found

  /rooms:
    post:
      summary: Create a room
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'

  /rooms/{id}:
    patch:
      summary: Update a room
      tags:
        - Rooms
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Room updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          description: Room not found

  /equipment:
    post:
      summary: Create property equipment
      tags:
        - Equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentRequest'
      responses:
        '201':
          description: Equipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'

  /equipment/{propertyId}/{equipmentType}:
    patch:
      summary: Update property equipment quantity
      tags:
        - Equipment
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: equipmentType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
      responses:
        '200':
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '404':
          description: Equipment not found for property

  /equipment-types:
    get:
      summary: Get all equipment types
      tags:
        - Equipment Types
      responses:
        '200':
          description: List of equipment types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentTypeResponse'

  /roommate-requests:
    post:
      summary: Create roommate request
      tags:
        - Roommate Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoommateRequestRequest'
      responses:
        '201':
          description: Roommate request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestResponse'
        '401':
          description: Unauthorized
    get:
      summary: Get paginated roommate requests
      tags:
        - Roommate Requests
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: lat
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Paginated list of roommate requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestListResponse'

  /roommate-requests/{roommateRequestId}:
    get:
      summary: Get roommate request detail by id
      description: Returns a single roommate request together with its owner's contact details and the full property.
      tags:
        - Roommate Requests
      parameters:
        - name: roommateRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Roommate request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoommateRequestDetailResponse'
        '404':
          description: Roommate request not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Enums
    InterestEnum:
      type: string
      enum:
        - FIND_HOUSING
        - RENT

    RoomTypeEnum:
      type: string
      enum:
        - DORMITORY
        - BATHROOM
        - KITCHEN
        - LIVING_ROOM
        - TOILET
        - WARDROBE
        - BALCONY
        - OTHER

    CurrencyEnum:
      type: string
      enum:
        - EUR
        - CZK
        - USD

    RoommateRequestStatus:
      type: string
      enum:
        - ACTIVE
        - RESERVED
        - CLOSED
        - EXPIRED

    # Shared
    IdealLocation:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng

    # Auth / User Schemas
    AuthUserDtoRequest:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            image:
              type: string
          required:
            - name
            - email
            - image
        expires:
          type: string
        idToken:
          type: string
      required:
        - user
        - idToken

    UserSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'
      required:
        - id
        - userId

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        image:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userSettings:
          $ref: '#/components/schemas/UserSettings'
      required:
        - id
        - email
        - fullName
        - createdAt
        - updatedAt
        - userSettings

    AuthUserDtoResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - token
        - user

    # User Settings Schemas
    UpdateUserSettingsRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'

    UpdateUserSettingsResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
        primaryInterest:
          $ref: '#/components/schemas/InterestEnum'
        idealLocation:
          $ref: '#/components/schemas/IdealLocation'
      required:
        - userId

    # Property Schemas
    RoomDto:
      type: object
      properties:
        roomType:
          $ref: '#/components/schemas/RoomTypeEnum'
        count:
          type: integer
          minimum: 1
      required:
        - roomType
        - count

    EquipmentDto:
      type: object
      properties:
        equipmentType:
          type: string
        count:
          type: integer
          minimum: 1
      required:
        - equipmentType
        - count

    CreatePropertyRequest:
      type: object
      properties:
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        sizeM2:
          type: number
        roomCount:
          type: integer
          minimum: 1
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
      required:
        - ownerId
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - rooms
        - equipment

    PropertyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        sizeM2:
          type: number
        roomCount:
          type: integer
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
      required:
        - id
        - ownerId
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - createdAt
        - updatedAt
        - rooms
        - equipment

    PropertyDetailResponse:
      description: Full property details including photos, rooms and equipment.
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        description:
          type: string
        sizeM2:
          type: number
          nullable: true
        roomCount:
          type: integer
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomDto'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDto'
        images:
          type: array
          items:
            $ref: '#/components/schemas/PropertyImageResponse'
      required:
        - id
        - ownerId
        - description
        - roomCount
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - createdAt
        - updatedAt
        - rooms
        - equipment

    PropertyImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        imageUrl:
          type: string
        title:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - propertyId
        - imageUrl
        - title
        - createdAt
        - updatedAt

    # Room Schemas
    CreateRoomRequest:
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
        roomType:
          $ref: '#/components/schemas/RoomTypeEnum'
        count:
          type: integer
          minimum: 1
      required:
        - propertyId
        - roomType
        - count

    UpdateRoomRequest:
      type: object
      properties:
        roomType:
          $ref: '#/components/schemas/RoomTypeEnum'
        count:
          type: integer
          minimum: 1

    RoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomType:
          $ref: '#/components/schemas/RoomTypeEnum'
        count:
          type: integer
      required:
        - id
        - propertyId
        - roomType
        - count

    # Equipment Schemas
    CreateEquipmentRequest:
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
        equipmentType:
          type: string
        count:
          type: integer
          minimum: 1
      required:
        - propertyId
        - equipmentType
        - count

    UpdateEquipmentRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
      required:
        - count

    EquipmentResponse:
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
        equipmentType:
          type: string
        count:
          type: integer
      required:
        - propertyId
        - equipmentType
        - count

    EquipmentTypeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    # Roommate Request Schemas
    CreateRoommateRequestRequest:
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
          minimum: 1
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        idealMoveInDate:
          type: string
          format: date
        maxRoommates:
          type: integer
          minimum: 1
        currentRoommates:
          type: integer
          minimum: 0
      required:
        - propertyId
        - title
        - description
        - priceAmount
        - priceCurrency
        - maxRoommates
        - currentRoommates

    RoommateRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        idealMoveInDate:
          type: string
          format: date
          nullable: true
        maxRoommates:
          type: integer
        currentRoommates:
          type: integer
        status:
          $ref: '#/components/schemas/RoommateRequestStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - propertyId
        - createdBy
        - title
        - description
        - priceAmount
        - priceCurrency
        - maxRoommates
        - currentRoommates
        - status
        - createdAt
        - updatedAt

    RoommateRequestOwner:
      description: Owner (creator) of the roommate request and its property.
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        profileUrl:
          type: string
          nullable: true
      required:
        - fullName

    RoommateRequestDetailResponse:
      description: A roommate request together with its owner's contact details and the full property.
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        idealMoveInDate:
          type: string
          format: date
          nullable: true
        maxRoommates:
          type: integer
        currentRoommates:
          type: integer
        status:
          $ref: '#/components/schemas/RoommateRequestStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        owner:
          $ref: '#/components/schemas/RoommateRequestOwner'
        property:
          $ref: '#/components/schemas/PropertyDetailResponse'
      required:
        - id
        - propertyId
        - createdBy
        - title
        - description
        - priceAmount
        - priceCurrency
        - maxRoommates
        - currentRoommates
        - status
        - createdAt
        - updatedAt
        - owner
        - property

    RoommateRequestListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoommateRequestListItem'
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor

    RoommateRequestListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        maxRoommates:
          type: integer
        currentRoommates:
          type: integer
        priceAmount:
          type: integer
        priceCurrency:
          $ref: '#/components/schemas/CurrencyEnum'
        property:
          $ref: '#/components/schemas/RoommateRequestPropertySummary'
      required:
        - id
        - title
        - maxRoommates
        - currentRoommates
        - priceAmount
        - priceCurrency
        - property

    RoommateRequestPropertySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        lat:
          type: number
        lng:
          type: number
        titleImageId:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - country
        - city
        - zipCode
        - street
        - streetNumber
        - lat
        - lng
        - titleImageId
