# ---------------------------------------------------------------------------
# Production / VM deployment compose.
#
# Only the NestJS apps run here. PostgreSQL and RabbitMQ live in the cloud and
# are configured through each app's `.env` (DATABASE_URL / RABBITMQ_URL).
#
# Local dev (PostGIS + RabbitMQ) lives in docker-compose.local.yml.
# ---------------------------------------------------------------------------
version: "3.9"

services:
  core:
    image: homie-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homie-core
    restart: unless-stopped
    env_file:
      - ./apps/core/.env
    environment:
      # Absolute path so PushService finds the mounted Firebase credentials
      # regardless of the working directory.
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
    volumes:
      # FCM push notifications. Remove this volume + the env override above to
      # disable push (the service then only logs a warning).
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "3001:3001"
    command: ["node", "apps/core/dist/main.js"]

  worker:
    image: homie-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homie-worker
    restart: unless-stopped
    env_file:
      - ./apps/worker/.env
    ports:
      - "3002:3002"
    command: ["node", "apps/worker/dist/main.js"]
